<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DECIDE | Staff Web-Portal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><polygon points='32,4 38,22 57,22 43,34 49,52 32,41 15,52 21,34 7,22 26,22' fill='%23b01030'/></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="design.css" />
</head>
<body>

<section id="auth-screen" role="dialog" aria-labelledby="auth-title" aria-describedby="auth-desc">
  <svg id="auth-logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="32,4 38,22 57,22 43,34 49,52 32,41 15,52 21,34 7,22 26,22" fill="#b01030"/>
    <circle cx="32" cy="32" r="10" fill="white" fill-opacity="0.1"/>
    <circle cx="32" cy="32" r="5" fill="white" fill-opacity="0.3"/>
  </svg>
  <h1 id="auth-title">DECIDE</h1>
  <p id="auth-desc">Staff Portal - вход в систему</p>

  <form id="login-form" novalidate>
    <label for="login-password">Пароль доступа</label>
    <input type="password" id="login-password" placeholder="••••••••••" aria-describedby="error-msg" aria-required="true" autocomplete="current-password" />
    <div id="error-msg" role="alert" aria-live="assertive"></div>
    <button id="login-submit" type="submit" aria-label="Войти">Войти →</button>
  </form>
</section>

<section id="loading-screen" aria-live="polite" aria-busy="true" aria-label="Загрузка" tabindex="-1">
  <div id="loading-text">Загрузка, пожалуйста подождите...</div>
  <div id="loading-progress">
    <div id="loading-progress-fill"></div>
  </div>
</section>

<div id="dashboard" role="main" tabindex="-1" aria-label="DECIDE Staff Portal">

  <header class="nav-header" role="banner">
    <div class="logo-container" aria-label="Логотип DECIDE">
      <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <polygon points="14,2 17,10 26,10 19,15 22,24 14,19 6,24 9,15 2,10 11,10" fill="#b01030"/>
      </svg>
      <span class="logo-text">DECIDE</span>
    </div>
    <nav class="main-nav" role="navigation" aria-label="Главное меню">
      <a href="#" class="active" aria-current="page" tabindex="0">Главная</a>
      <a href="#" tabindex="0">Справочник</a>
      <a href="#" tabindex="0">Правила</a>
    </nav>
  </header>

  <main class="portal-content">
    <section class="welcome-section" tabindex="0" aria-label="Добро пожаловать">
      <div class="welcome-label">Добро пожаловать</div>
      <h2 class="welcome-title">Staff Portal</h2>
      <p class="welcome-subtitle">Портал для персонала · DECIDE</p>
    </section>
  </main>

</div>

<script src="logics.js"></script>
</body>
</html>
